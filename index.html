<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#242629" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
    <title>祀 Si · Endfield 3D Viewer</title>
  </head>
  <body>
    <main id="app">
      <div id="viewport" aria-label="3D 模型展示區"></div>
      <header><p>ARKNIGHTS: ENDFIELD</p><h1>祀 <span>Si</span></h1></header>
      <section class="panel" aria-label="模型操作" data-expanded="false">
        <div class="panel-heading">
          <p id="status" role="status" aria-live="polite">準備載入模型…</p>
          <button id="panel-toggle" aria-expanded="false" aria-controls="panel-content">展開操作</button>
        </div>
        <div id="panel-content" hidden>
        <div class="actions">
          <label class="button" for="model-file">上傳本機 GLB</label>
          <input id="model-file" type="file" accept=".glb" />
          <button id="reset" disabled>重設視角</button>
          <button id="idle-toggle" aria-pressed="false" disabled>待機</button>
        </div>
        <p class="hint">原創角色動作</p>
        <div class="actions" role="group" aria-label="原創角色動作">
          <button id="gesture" data-gesture="cold" aria-label="1 · 高冷嫌棄、別過頭" disabled>1 · 高冷嫌棄</button>
          <button data-gesture="shy" aria-label="2 · 嘴硬害羞、偷看你" disabled>2 · 嘴硬害羞</button>
        </div>
        <p class="hint">拖曳旋轉 · 雙指縮放／平移<br />電腦：左鍵旋轉 · 滾輪縮放 · 右鍵平移</p>
        <p id="model-credit" class="credit" hidden><a href="https://sketchfab.com/3d-models/si-arknights-endfield-304e5f23db204cbd834b44138ca570d7" target="_blank" rel="noopener noreferrer">Si / Arknights Endfield</a> · <a href="https://sketchfab.com/Abcxyz51" target="_blank" rel="noopener noreferrer">Abcxyz51</a><br /><a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a> · Sketchfab GLB 轉檔版本，原模型檔未改動；本站加入骨骼待機與原創互動</p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
